<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360" fill="none">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <linearGradient id="accent-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <linearGradient id="accent-purple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <linearGradient id="glow-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.05" />
    </linearGradient>

    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <!-- Glowing Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="box-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .grid-line { stroke: #334155; stroke-opacity: 0.22; stroke-width: 1; }
    .pulse-dot { animation: pulse 3s ease-in-out infinite alternate; }
    .flow-dash { stroke-dasharray: 8 12; animation: flowMove 20s linear infinite; }
    .float-card-1 { animation: float1 6s ease-in-out infinite alternate; }
    .float-card-2 { animation: float2 7s ease-in-out infinite alternate; }
    .float-card-3 { animation: float3 5s ease-in-out infinite alternate; }
    .package-move { animation: deliverMove 12s linear infinite; }
    
    @keyframes flowMove {
      from { stroke-dashoffset: 0; }
      to { stroke-dashoffset: -400; }
    }
    @keyframes float1 {
      0% { transform: translateY(0px); }
      100% { transform: translateY(-10px); }
    }
    @keyframes float2 {
      0% { transform: translateY(0px); }
      100% { transform: translateY(12px); }
    }
    @keyframes float3 {
      0% { transform: translateY(0px); }
      100% { transform: translateY(-8px); }
    }
    @keyframes deliverMove {
      0% { transform: translateX(0px); opacity: 0; }
      10% { opacity: 1; }
      90% { opacity: 1; }
      100% { transform: translateX(520px); opacity: 0; }
    }
    @keyframes pulse {
      0% { opacity: 0.3; transform: scale(0.98); }
      100% { opacity: 0.9; transform: scale(1.02); }
    }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="360" rx="16" fill="url(#bg-grad)" />

  <!-- Technical Grid Background -->
  <g>
    <line x1="100" y1="0" x2="100" y2="360" class="grid-line" />
    <line x1="250" y1="0" x2="250" y2="360" class="grid-line" />
    <line x1="400" y1="0" x2="400" y2="360" class="grid-line" />
    <line x1="550" y1="0" x2="550" y2="360" class="grid-line" />
    <line x1="700" y1="0" x2="700" y2="360" class="grid-line" />
    <line x1="850" y1="0" x2="850" y2="360" class="grid-line" />
    <line x1="1000" y1="0" x2="1000" y2="360" class="grid-line" />
    <line x1="1150" y1="0" x2="1150" y2="360" class="grid-line" />

    <line x1="0" y1="60" x2="1200" y2="60" class="grid-line" />
    <line x1="0" y1="120" x2="1200" y2="120" class="grid-line" />
    <line x1="0" y1="180" x2="1200" y2="180" class="grid-line" />
    <line x1="0" y1="240" x2="1200" y2="240" class="grid-line" />
    <line x1="0" y1="300" x2="1200" y2="300" class="grid-line" />
  </g>

  <!-- Ambient Light Orbs -->
  <circle cx="150" cy="80" r="140" fill="#38bdf8" opacity="0.08" filter="url(#glow)" />
  <circle cx="1080" cy="280" r="160" fill="#8b5cf6" opacity="0.1" filter="url(#glow)" />

  <!-- DYNAMIC / ANIMATED BACKGROUND ELEMENTS (Fulfillment Pipeline & Floating Status Cards) -->
  <g opacity="0.75">
    <!-- Automated Conveyor & Pipeline Flow Track -->
    <path d="M 640 260 L 800 260 C 850 260, 880 230, 920 230 L 1140 230" 
          stroke="#0284c7" stroke-width="3" stroke-linecap="round" fill="none" class="flow-dash" />
    
    <path d="M 640 290 L 760 290 C 810 290, 840 310, 890 310 L 1120 310" 
          stroke="#6366f1" stroke-width="2.5" stroke-linecap="round" fill="none" class="flow-dash" style="animation-direction: reverse; animation-duration: 15s;" />

    <!-- Moving Package Delivery Tracer -->
    <g class="package-move">
      <circle cx="640" cy="260" r="5" fill="#38bdf8" filter="url(#box-glow)" />
      <polygon points="636,256 644,256 644,264 636,264" fill="#67e8f9" />
    </g>

    <!-- Floating Order Status Cards (Right Side Background) -->
    <g class="float-card-1" transform="translate(860, 45)">
      <rect width="180" height="48" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.2" opacity="0.9" />
      <circle cx="24" cy="24" r="8" fill="#10b981" opacity="0.25" />
      <circle cx="24" cy="24" r="4" fill="#10b981" />
      <text x="42" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica" font-size="11" font-weight="600" fill="#f1f5f9">Order #9842 Filled</text>
      <text x="42" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica" font-size="10" fill="#94a3b8">Routing: Auto (Fastest)</text>
    </g>

    <g class="float-card-2" transform="translate(980, 115)">
      <rect width="170" height="48" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.2" opacity="0.9" />
      <circle cx="24" cy="24" r="8" fill="#38bdf8" opacity="0.25" />
      <circle cx="24" cy="24" r="4" fill="#38bdf8" />
      <text x="42" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica" font-size="11" font-weight="600" fill="#f1f5f9">Inventory Sync</text>
      <text x="42" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica" font-size="10" fill="#94a3b8">WMS ⟷ Multi-Channel</text>
    </g>

    <g class="float-card-3" transform="translate(890, 185)">
      <rect width="160" height="42" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.2" opacity="0.85" />
      <circle cx="22" cy="21" r="7" fill="#8b5cf6" opacity="0.25" />
      <circle cx="22" cy="21" r="3.5" fill="#a855f7" />
      <text x="38" y="19" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica" font-size="11" font-weight="600" fill="#f1f5f9">Dispatched</text>
      <text x="38" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica" font-size="10" fill="#94a3b8">Carrier SLA: On-Time</text>
    </g>
  </g>

  <!-- FOREGROUND BRANDING & HEADER CONTENT (Always in front & crystal clear) -->
  <g transform="translate(80, 0)">
    
    <!-- Category Pill Tag -->
    <g transform="translate(0, 52)">
      <rect width="260" height="30" rx="15" fill="#1e293b" stroke="#0ea5e9" stroke-width="1.2" />
      <circle cx="16" cy="15" r="4" fill="#38bdf8" />
      <text x="28" y="19" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica" font-size="11.5" font-weight="700" fill="#38bdf8" letter-spacing="0.8">📦 E-COMMERCE &amp; LOGISTICS TECH</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="135" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica" font-size="44" font-weight="900" fill="url(#text-grad)" letter-spacing="-1">
      Awesome Order Processing
    </text>
    <text x="0" y="185" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica" font-size="44" font-weight="900" fill="url(#text-grad)" letter-spacing="-1">
      &amp; Fulfillment
    </text>

    <!-- Subtitle -->
    <text x="2" y="228" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica" font-size="17" font-weight="400" fill="#cbd5e1" letter-spacing="0.2">
      Curated directory of high-performance OMS, WMS, 3PL &amp; Logistics Platforms
    </text>

    <!-- Badges Row -->
    <g transform="translate(2, 260)">
      <!-- Badge 1: SaaS / Commercial -->
      <g>
        <rect width="136" height="28" rx="6" fill="#1e293b" stroke="#334155" />
        <text x="12" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica" font-size="11.5" font-weight="600" fill="#94a3b8">🏢 SaaS &amp; 3PL Hubs</text>
      </g>
      <!-- Badge 2: Open Source -->
      <g transform="translate(148, 0)">
        <rect width="144" height="28" rx="6" fill="#1e293b" stroke="#334155" />
        <text x="12" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica" font-size="11.5" font-weight="600" fill="#10b981">⚡ Open-Source Systems</text>
      </g>
      <!-- Badge 3: Autonomous Routing -->
      <g transform="translate(304, 0)">
        <rect width="142" height="28" rx="6" fill="#1e293b" stroke="#334155" />
        <text x="12" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica" font-size="11.5" font-weight="600" fill="#a855f7">🤖 AI &amp; Smart Routing</text>
      </g>
    </g>
  </g>

  <!-- Accent Bottom Border Line -->
  <rect x="0" y="356" width="1200" height="4" fill="url(#accent-cyan)" />
</svg>
